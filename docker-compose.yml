services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecourts
      POSTGRES_USER: ecourts
      POSTGRES_PASSWORD: ecourts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecourts -d ecourts"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_NAME: eCourts Tracker
      DATABASE_URL: postgresql://ecourts:ecourts@db:5432/ecourts
      SOURCE_API_BASE_URL: ${SOURCE_API_BASE_URL:-}
      SOURCE_CASE_PATH: ${SOURCE_CASE_PATH:-/case/{cino}}
      SOURCE_ORDERS_PATH: ${SOURCE_ORDERS_PATH:-/case/{cino}}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      ORDER_WARN_SECONDS: ${ORDER_WARN_SECONDS:-480}
      BULK_REFRESH_SLEEP: ${BULK_REFRESH_SLEEP:-0.8}
volumes:
  pgdata:
