name: Build eCourt Glass APK

on:
  push:
    branches: [android-ecourts-client]
    paths:
      - '.v6direct/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact eCourt Glass v6 source
        shell: bash
        run: |
          cat \
            .v6direct/part00 \
            .v6direct/part01 \
            .v6direct/part02 \
            .v6direct/part03 \
            .v6direct/part04 \
            .v6direct/part05 \
            .v6direct/part06 \
            .v6direct/part07 > /tmp/ecourt-v6.b64
          test "$(wc -c < /tmp/ecourt-v6.b64)" = "56448"
          base64 --decode /tmp/ecourt-v6.b64 > /tmp/ecourt-v6.tar.gz
          echo '4f61c6c0835ab52b2ed2599c9f22e997f67117db844b80290a74a0125097802d  /tmp/ecourt-v6.tar.gz' | sha256sum --check
          tar -xzf /tmp/ecourt-v6.tar.gz

      - name: Verify v6 queue and transport invariants
        shell: bash
        run: |
          API=android-client/app/src/main/java/in/vigarepo/ecourtglass/EcourtsApi.java
          BRIDGE=android-client/app/src/main/java/in/vigarepo/ecourtglass/AppBridge.java
          DB=android-client/app/src/main/java/in/vigarepo/ecourtglass/CaseDb.java
          grep -q 'https://app.ecourts.gov.in/services_DC_4.0/' "$API"
          grep -q 'https://app.ecourts.gov.in/services_HC_4.0/' "$API"
          grep -q 'APP_VERSION = "4.0.5"' "$API"
          grep -q 'setRequestMethod("GET")' "$API"
          grep -q '"Authorization", "Bearer " + bearerToken.trim()' "$API"
          grep -q 'if (wr.code == 405)' "$API"
          grep -q 'SYNC_WORKERS = 5' "$BRIDGE"
          grep -q 'unfinished CNR queued' "$BRIDGE"
          grep -q 'isServerPauseMessage' "$BRIDGE"
          grep -q 'cv.put("sync_state","queued")' "$DB"
          grep -q 'markSyncPaused' "$DB"
          grep -q 'recoverInterruptedSync' "$DB"
          grep -q 'versionName = "6.0.0"' android-client/app/build.gradle.kts
          ! grep -q 'ecourt_mobile_DC' "$API"

      - name: Validate v6 UI FIR picker and controls
        shell: bash
        run: |
          node --check android-client/app/src/main/assets/app.js
          grep -q 'Resume pending' android-client/app/src/main/assets/index.html
          grep -q 'resetFetchedData' android-client/app/src/main/assets/app.js
          grep -q 'clearFetchedDataKeepCnrs' android-client/app/src/main/assets/app.js
          grep -q 'loadFirStates' android-client/app/src/main/assets/app.js
          grep -q 'loadFirDistricts' android-client/app/src/main/assets/app.js
          grep -q 'loadFirCourts' android-client/app/src/main/assets/app.js
          grep -q 'loadFirPolice' android-client/app/src/main/assets/app.js
          grep -q 'FIR search uses District Courts' android-client/app/src/main/assets/app.js
          python - <<'PY'
          import re, pathlib
          root=pathlib.Path('android-client/app/src/main/assets')
          html=(root/'index.html').read_text()
          js=(root/'app.js').read_text()
          handlers=set(re.findall(r'onclick="([A-Za-z_$][\w$]*)\s*\(', html))
          declared=set(re.findall(r'(?:function\s+|window\.)([A-Za-z_$][\w$]*)', js))
          missing=sorted(handlers-declared)
          print('onclick handlers:', len(handlers), 'missing:', missing)
          if missing: raise SystemExit(1)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build v6 debug APK
        run: gradle -p android-client :app:assembleDebug --stacktrace

      - name: Verify packaged v6 APK
        shell: bash
        run: |
          APK=android-client/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/app.js > /tmp/bundled-app.js
          unzip -p "$APK" assets/index.html > /tmp/bundled-index.html
          node --check /tmp/bundled-app.js
          grep -q 'Resume pending' /tmp/bundled-index.html
          grep -q 'clearFetchedDataKeepCnrs' /tmp/bundled-app.js
          grep -q 'loadFirPolice' /tmp/bundled-app.js
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"

      - name: Upload final v6 APK
        uses: actions/upload-artifact@v4
        with:
          name: eCourt-Glass-v6-final-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
