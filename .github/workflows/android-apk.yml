name: Build eCourt Glass APK

on:
  push:
    branches: [android-ecourts-client]
    paths:
      - '.android-build/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified v2 source
        shell: bash
        run: |
          cat \
            .android-build/v2parts/part00 \
            .android-build/v2parts/part01 \
            .android-build/v2parts/part02 \
            .android-build/v2parts/part03 \
            .android-build/v2parts/part04 \
            .android-build/v2parts/part05 \
            .android-build/v2parts/part06a \
            .android-build/v2parts/part06b \
            .android-build/v2parts/part07 \
            .android-build/v2parts/part08 > /tmp/android-source.b64
          base64 --decode /tmp/android-source.b64 > /tmp/android-source.tar.gz
          echo '48628c1fd12600fab6a92759e3f0b8b5fdd190d834ffb1571e1b40a68ea991f9  /tmp/android-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/android-source.tar.gz
      - name: Apply current eCourts 4.0.5 compatibility patch
        run: python .android-build/patch-v3.py
      - name: Verify patched routes
        shell: bash
        run: |
          grep -q 'services_DC_4.0' android-client/app/src/main/java/in/vigarepo/ecourtglass/EcourtsApi.java
          grep -q 'services_HC_4.0' android-client/app/src/main/java/in/vigarepo/ecourtglass/EcourtsApi.java
          grep -q 'APP_PROTOCOL_VERSION = "4.0"' android-client/app/src/main/java/in/vigarepo/ecourtglass/EcourtsApi.java
          grep -q 'searchByPartyName.php' android-client/app/src/main/assets/app.js
          grep -q 'caseTypesWebService.php' android-client/app/src/main/assets/app.js
          grep -q 'versionName = "3.0.0"' android-client/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate web assets
        run: node --check android-client/app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle -p android-client :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          unzip -t android-client/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum android-client/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eCourt-Glass-v3-services4-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
