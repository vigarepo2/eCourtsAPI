name: Build eCourt Glass APK

on:
  push:
    branches: [android-ecourts-client]
    paths:
      - '.android-build/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android source
        shell: bash
        run: |
          cat .android-build/android-src.part* > /tmp/android-source.b64
          base64 --decode /tmp/android-source.b64 > /tmp/android-source.tar.gz
          echo '9a870dbadb1d7159856cca01d91534074407c9795062ebe0d305202d3a866b18  /tmp/android-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/android-source.tar.gz
      - name: Pin stable Android SDK
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' android-client/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' android-client/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle -p android-client :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eCourt-Glass-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
