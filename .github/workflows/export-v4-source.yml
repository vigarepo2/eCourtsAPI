name: Export eCourt Glass v5 Source

on:
  push:
    branches: [android-ecourts-client]
    paths:
      - '.github/workflows/export-v4-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          cat \
            .v5src/part00 \
            .v5src/part01 \
            .v5src/part02 \
            .v5src/part03 \
            .v5src/part04 \
            .v5src/part05 \
            .v5src/part06 \
            .v5src/part07 \
            .v5src/part08 \
            .v5src/part09 \
            .v5src/part10 \
            .v5src/part11 \
            .v5src/part12 > /tmp/ecourt-v5.b64
          base64 --decode /tmp/ecourt-v5.b64 > /tmp/ecourt-v5.tar.gz
          echo '6164026f8f937e5e8dc487772d8d61ac051b488b7a68b46c2be2fdd5bb268139  /tmp/ecourt-v5.tar.gz' | sha256sum --check
          tar -xzf /tmp/ecourt-v5.tar.gz
          tar -czf /tmp/eCourt-Glass-v5-source.tar.gz android-client
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: eCourt-Glass-v5-source
          path: /tmp/eCourt-Glass-v5-source.tar.gz
          if-no-files-found: error
